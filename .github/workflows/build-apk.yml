name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK - let Bubblewrap install its own JDK and SDK
        run: yes | npx @bubblewrap/cli build --skipSigning --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-hunter-apk
          path: |
            *.apk
            **/*.apk