name: Build Hunter Pro V2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check files exist
        run: |
          ls -la
          test -f server.js || (echo "server.js missing!" && exit 1)
          test -f hunter.html || (echo "hunter.html missing!" && exit 1)
          test -f package.json || (echo "package.json missing!" && exit 1)
          echo "All files OK"

      - name: Check Node syntax
        run: node --check server.js

      - name: Build passed
        run: echo "Hunter Pro V2 build successful"
