<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Hunter Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- Application Styles: Layout, Cards, Detail View, Safety, Alerts and Portfolio -->
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#0b0e14;color:#e6e8ec;padding:16px;padding-bottom:40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
header h1{font-size:22px}header h1 span{color:#22c55e}
.live{font-size:12px;background:#14532d;color:#bbf7d0;padding:5px 10px;border-radius:20px}
.updated{font-size:11px;color:#9aa4b2;text-align:right;margin:-8px 0 12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;background:#151a24;border-radius:12px;padding:4px;flex:1}
.tabs button{flex:1;border:0;background:transparent;color:#9aa4b2;padding:9px;border-radius:9px;cursor:pointer;font-weight:600}
.tabs button.active{background:#22c55e;color:#000}
input,select{background:#151a24;border:1px solid #232a35;color:#fff;padding:10px 12px;border-radius:12px;outline:none;width:100%}
.search{flex:2;min-width:180px}.sort{flex:1;min-width:140px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters label{font-size:12px;color:#9aa4b2;display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.portfolio-bar{background:#151a24;border:1px solid #22c55e;border-radius:12px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.portfolio-bar b{font-size:16px}.portfolio-bar span{font-size:12px;color:#9aa4b2}
.portfolio-bar button{background:#22c55e;border:0;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#151a24;border:1px solid #232a35;border-radius:16px;padding:14px;cursor:pointer}
.card:hover{border-color:#22c55e}
.top{display:flex;gap:10px;align-items:center}
.top img{width:40px;height:40px;border-radius:50%;background:#222}
.top b{font-size:16px}.top small{color:#9aa4b2}
.badge{margin-left:auto;font-size:11px;padding:4px 8px;border-radius:20px;background:#1e293b}
.badge.hot{background:#7f1d1d;color:#fecaca}.badge.new{background:#14532d;color:#bbf7d0}
.price{font-size:20px;font-weight:800;margin:10px 0 4px}
.up{color:#22c55e}.down{color:#ef4444}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:13px}
.stats div{background:#0b0e14;padding:8px;border-radius:10px}.stats span{color:#9aa4b2;display:block;font-size:11px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:9px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.buy{background:#22c55e}.watch{background:#1e293b;color:#fff}.watch.saved{background:#eab308;color:#000}
.alert-btn{background:#7c3aed !important;color:#fff !important}
.empty{text-align:center;color:#9aa4b2;padding:40px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center;z-index:99}
#modal.open{display:flex}
.sheet{background:#151a24;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.sheet h2{font-size:22px}.close{float:right;background:#222;border:0;color:#fff;padding:8px 12px;border-radius:50%;cursor:pointer}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.detail-grid div{background:#0b0e14;padding:10px;border-radius:10px;font-size:13px}.detail-grid span{color:#9aa4b2;display:block;font-size:11px}
.contract{display:flex;gap:8px;background:#0b0e14;padding:10px;border-radius:10px;font-size:12px;word-break:break-all;margin:10px 0}
.contract button{background:#22c55e;border:0;padding:6px 10px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
canvas{background:#0b0e14;border-radius:12px;padding:8px}
.acquire{background:#0b0e14;border:1px solid #22c55e;border-radius:12px;padding:12px;margin:12px 0}
.acquire h3{font-size:15px;margin-bottom:8px}
.acquire p{font-size:13px;color:#cbd5e1;line-height:1.5}
.acquire .tag{display:inline-block;background:#14532d;color:#bbf7d0;padding:4px 8px;border-radius:20px;font-size:11px;margin:4px 4px 0 0}
.acquire .tag.warn{background:#7f1d1d;color:#fecaca}
.info-box{background:#fef3c7;color:#92400e;padding:10px;border-radius:10px;font-size:12px;line-height:1.5;margin:12px 0}
.safety-box{background:#0b0e14;border:1px solid #eab308;border-radius:12px;padding:12px;margin:12px 0}
.safety-box h3{font-size:15px;margin-bottom:8px}
.alert-box{background:#0b0e14;border:1px solid #7c3aed;border-radius:12px;padding:12px;margin:12px 0}
.alert-box h3{font-size:15px;margin-bottom:8px}
.portfolio-box{background:#0b0e14;border:1px solid #22c55e;border-radius:12px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<!-- Header: Brand identity and live market status -->
<header><h1>Coin Hunter <span>Pro</span></h1><div class="live">LIVE</div></header>
<!-- Data Freshness: Shows when market data was last refreshed -->
<div class="updated" id="lastUpdated">Updating data...</div>

<!-- Portfolio Bar: Total value, profit/loss, quick access -->
<div class="portfolio-bar">
<div><b id="portfolioValue">$0.00</b><br><span id="portfolioPnL">Portfolio: 0 coins</span></div>
<div><span id="alertsCount">Alerts: 0 active</span></div>
<button onclick="openPortfolio()">My Portfolio</button>
</div>

<!-- Navigation: Switch between New listings, Trending tokens, Watchlist, Alerts -->
<div class="controls">
<div class="tabs">
<button class="active" data-tab="new" onclick="setTab('new',this)">New</button>
<button data-tab="trending" onclick="setTab('trending',this)">Trending</button>
<button data-tab="watchlist" onclick="setTab('watchlist',this)">Watchlist (<span id="watchCount">0</span>)</button>
<button data-tab="alerts" onclick="setTab('alerts',this)">Alerts</button>
</div>
</div>

<!-- Search and Sorting: Find tokens by name, symbol or contract and order results -->
<div class="controls">
<input class="search" id="search" placeholder="Search by name, symbol or contract..." oninput="render()">
<select class="sort" id="sort" onchange="render()">
<option value="newest">Sort: Newest</option>
<option value="hottest">Sort: Hottest (24h Change)</option>
<option value="liquidity">Sort: Biggest Liquidity</option>
<option value="volume">Sort: Biggest Volume 24h</option>
<option value="mcap">Sort: Biggest Market Cap</option>
<option value="safety">Sort: Safest First</option>
</select>
</div>

<!-- Filters: Refine results by liquidity, volume, chain and token age -->
<div class="filters">
<label>Min Liquidity $<input type="number" id="minLiq" value="0" oninput="render()"></label>
<label>Min Volume 24h $<input type="number" id="minVol" value="0" oninput="render()"></label>
<label>Chain<select id="chain" onchange="render()"><option value="all">All Chains</option><option value="solana">Solana</option><option value="bsc">BSC</option><option value="ethereum">Ethereum</option><option value="base">Base</option></select></label>
<label>Max Age (hours)<input type="number" id="maxAge" value="72" oninput="render()"></label>
<label>Min Safety Score<input type="number" id="minSafety" value="0" min="0" max="100" oninput="render()" placeholder="0-100"></label>
</div>

<!-- Token Grid: Populated dynamically from DexScreener direct -->
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">No coins found. Try lowering filters.</div>

<!-- Detail Modal: Token overview, price chart, safety, alerts, portfolio, acquisition guide -->
<div id="modal"><div class="sheet">
<button class="close" onclick="closeModal()">X</button>
<div id="detail"></div>
</div></div>
<script>
/**
 * Coin Hunter Pro - Full Version
 * Features: New/Trending/Watchlist/Alerts, Safety Score, Price Alerts, Portfolio Tracker
 * Data: DexScreener Direct + GeckoTerminal Direct + GoPlus Security
 * Works on Render Static Site, no server.js needed.
 */

// State Management
let allCoins = [];
let currentTab = 'new';
let watchlist = JSON.parse(localStorage.getItem('ch_watch') || '[]');
let alerts = JSON.parse(localStorage.getItem('ch_alerts') || '[]'); // {address, symbol, targetPrice, type: 'above'|'below', active}
let portfolio = JSON.parse(localStorage.getItem('ch_portfolio') || '[]'); // {address, symbol, name, amount, buyPrice, buyDate}
let safetyCache = {}; // address -> safety result
let lastUpdatedAt = null;

// Data Accuracy: Maps app chain names to GeckoTerminal network names
function geckoNetwork(chain) {
  const m = { solana: 'solana', bsc: 'bsc', ethereum: 'eth', base: 'base' };
  return m[chain] || 'solana';
}

// Data Accuracy: Calculates real token age in hours
function calcAgeH(pairCreatedAt) {
  if (!pairCreatedAt) return null;
  const diff = Date.now() - pairCreatedAt;
  if (diff < 0) return 0;
  return diff / 3600000;
}

// Data Accuracy: Formats age for display
function fmtAge(ageH) {
  if (ageH === null || ageH === undefined) return 'Unknown';
  if (ageH < 1) return Math.max(1, Math.round(ageH * 60)) + 'm ago';
  if (ageH < 24) return Math.floor(ageH) + 'h ago';
  return Math.floor(ageH / 24) + 'd ago';
}

// Data Loading: Direct DexScreener - Works on Render Static, no server needed
async function load() {
  try {
    const profilesRes = await fetch('https://api.dexscreener.com/token-profiles/latest/v1').then(r => {
      if (!r.ok) throw new Error('DexScreener blocked: ' + r.status);
      return r.json();
    });
    const profiles = (profilesRes || []).slice(0, 30);
    const enriched = await Promise.all(profiles.map(async (t) => {
      const base = {
        name: t.name || 'Unknown', symbol: t.symbol || '?', address: t.tokenAddress,
        chain: t.chainId || 'solana', icon: t.icon || '', url: t.url || '', desc: t.description || '',
        price: 0, change: 0, liq: 0, vol: 0, mcap: 0,
        ageH: null, pairAddress: '', dex: '', pairCreatedAt: null, safetyScore: null
      };
      try {
        const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${t.tokenAddress}`).then(r => r.json());
        const pairs = pairRes?.pairs || [];
        if (pairs.length) {
          pairs.sort((a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0));
          const p = pairs[0];
          base.price = parseFloat(p.priceUsd || 0);
          base.change = parseFloat(p.priceChange?.h24 || 0);
          base.liq = p.liquidity?.usd || 0;
          base.vol = p.volume?.h24 || 0;
          base.mcap = p.fdv || p.marketCap || 0;
          base.dex = p.dexId;
          base.pairAddress = p.pairAddress;
          base.pairCreatedAt = p.pairCreatedAt || null;
          base.ageH = calcAgeH(p.pairCreatedAt);
          base.icon = p.info?.imageUrl || base.icon;
          base.chain = p.chainId || base.chain;
        }
      } catch (e) {}
      // Restore cached safety score if we already checked it
      if (safetyCache[base.address]) base.safetyScore = safetyCache[base.address].score;
      return base;
    }));
    allCoins = enriched.filter(c => c.price > 0 || c.liq > 0);
    if (!allCoins.length) allCoins = enriched;
    lastUpdatedAt = new Date();
    const el = document.getElementById('lastUpdated');
    if (el) el.textContent = 'Last updated: ' + lastUpdatedAt.toLocaleTimeString() + ' - Live from DexScreener';
    checkAlerts();
    updatePortfolioBar();
    render();
  } catch (e) {
    console.error(e);
    document.getElementById('grid').innerHTML = '<div class="empty">Failed to load market data. DexScreener may be rate-limiting. Wait 10 seconds and refresh.</div>';
  }
}

// Utilities: Formats a USD value
function fmt(n) {
  if (!n) return '$0';
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + Number(n).toFixed(4);
}
function fmtPrice(p) { if (!p) return '$0.000000'; if (p >= 1) return '$' + p.toFixed(4); return '$' + p.toFixed(6); }

// Navigation: Switches between tabs
function setTab(t, el) {
  currentTab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// Acquisition Guide: Where to get or mine a coin
function getAcquisition(c) {
  const mineable = ['BTC','BITCOIN','LTC','LITECOIN','DOGE','DOGECOIN','KAS','KASPA','ETC','XMR','MONERO','BCH'];
  const sym = (c.symbol || '').toUpperCase();
  const isMineable = mineable.includes(sym);
  const dexByChain = {
    solana: { name: 'Raydium / Jupiter', url: `https://raydium.io/swap/?inputCurrency=sol&outputCurrency=${c.address}`, cex: 'Binance, Bybit, OKX' },
    bsc: { name: 'PancakeSwap', url: `https://pancakeswap.finance/swap?outputCurrency=${c.address}`, cex: 'Binance, Bitget' },
    ethereum: { name: 'Uniswap', url: `https://app.uniswap.org/swap?outputCurrency=${c.address}`, cex: 'Binance, Coinbase, Kraken' },
    base: { name: 'Uniswap on Base', url: `https://app.uniswap.org/swap?outputCurrency=${c.address}`, cex: 'Coinbase, Bybit' }
  };
  const dex = dexByChain[c.chain] || { name: 'DexScreener', url: `https://dexscreener.com/${c.chain}/${c.address}`, cex: 'Check CoinGecko for CEX listing' };
  if (isMineable) {
    return { title: 'Mineable Coin - You Can Mine This', badge: 'MINEABLE', badgeClass: '', text: `${c.name} (${c.symbol}) runs on Proof-of-Work. You can mine it with hardware and earn rewards.`, steps: ['1. Get a wallet for ' + c.symbol + ' (official wallet or Trust Wallet)', '2. Join a mining pool: F2Pool, ViaBTC, Antpool or 2Miners', '3. Connect your ASIC / GPU miner to the pool', '4. You earn ' + c.symbol + ' directly to your wallet'], dexName: dex.name, dexUrl: dex.url, cex: dex.cex };
  }
  return { title: 'Not Mineable - Buy It Instead', badge: 'NOT MINEABLE - BUY ONLY', badgeClass: 'warn', text: `${c.name} (${c.symbol}) is a token on ${c.chain.toUpperCase()}. It cannot be mined. It was created on a smart contract and you get it by buying or swapping.`, steps: ['1. Buy ' + (c.chain === 'solana' ? 'SOL' : c.chain === 'bsc' ? 'BNB' : 'ETH') + ' on Binance / Bybit', '2. Send it to your wallet (Phantom for Solana, MetaMask for BSC / ETH / Base)', `3. Swap on ${dex.name} using the contract below`, '4. Or buy on CEX if listed: ' + dex.cex], dexName: dex.name, dexUrl: dex.url, cex: dex.cex };
}

// Safety Check: Uses GoPlus API to detect honeypot, mint, blacklist, high tax
async function getSafety(c) {
  if (safetyCache[c.address]) return safetyCache[c.address];
  const chainMap = { solana: 'solana', bsc: '56', ethereum: '1', base: '8453' };
  const chainId = chainMap[c.chain] || '1';
  try {
    const url = `https://api.gopluslabs.io/api/v1/token_security/${chainId}?contract_addresses=${c.address}`;
    const res = await fetch(url).then(r => r.json());
    const d = res?.result?.[c.address.toLowerCase()] || res?.result?.[c.address];
    if (!d) {
      const fallback = { score: 50, label: 'Unknown', color: '#eab308', risks: ['No security data found'], safe: [] };
      safetyCache[c.address] = fallback; return fallback;
    }
    let score = 100; let risks = []; let safe = [];
    if (d.is_honeypot === '1') { score = 0; risks.push('HONEYPOT - You cannot sell'); }
    if (d.is_mintable === '1') { score -= 25; risks.push('Owner can mint new tokens'); } else { safe.push('Cannot mint'); }
    if (d.is_blacklisted === '1') { score -= 20; risks.push('Owner can blacklist / freeze wallets'); }
    if (d.is_proxy === '1') { score -= 10; risks.push('Proxy contract - code can change'); }
    const buyTax = parseFloat(d.buy_tax || 0); const sellTax = parseFloat(d.sell_tax || 0);
    if (buyTax > 10 || sellTax > 10) { score -= 20; risks.push(`High Tax: Buy ${buyTax}% / Sell ${sellTax}%`); } else { safe.push(`Low Tax: Buy ${buyTax}% / Sell ${sellTax}%`); }
    if (d.owner_address && d.owner_address !== '0x0000000000000000000000000000000000000000') { score -= 5; risks.push('Owner not renounced'); } else { safe.push('Ownership renounced'); }
    const holders = parseInt(d.holder_count || 0);
    if (holders < 50) { score -= 10; risks.push(`Only ${holders} holders - very new/risky`); } else { safe.push(`${holders} holders`); }
    score = Math.max(0, Math.min(100, score));
    let label = score >= 80 ? 'SAFE' : score >= 50 ? 'MEDIUM RISK' : 'HIGH RISK';
    let color = score >= 80 ? '#22c55e' : score >= 50 ? '#eab308' : '#ef4444';
    const result = { score, label, color, risks, safe, buyTax, sellTax, holders };
    safetyCache[c.address] = result;
    const coin = allCoins.find(x => x.address === c.address);
    if (coin) coin.safetyScore = score;
    return result;
  } catch (e) {
    const fallback = { score: 50, label: 'Unknown', color: '#eab308', risks: ['Safety check failed'], safe: [] };
    safetyCache[c.address] = fallback; return fallback;
  }
}

// Safety UI: On-demand check to avoid rate-limiting
async function checkSafety(addr) {
  const c = allCoins.find(x => x.address === addr);
  if (!c) return;
  const el = document.getElementById(`safety-${addr}`);
  if (el) el.textContent = 'Checking...';
  const s = await getSafety(c);
  if (el) { el.textContent = `${s.score}/100 - ${s.label}`; el.style.color = s.color; }
  render();
  alert(`SAFETY REPORT - ${c.name} (${c.symbol})\n\nScore: ${s.score}/100 - ${s.label}\n\nRISKS:\n${s.risks.length ? s.risks.map(r => '• ' + r).join('\n') : 'None found'}\n\nSAFE:\n${s.safe.length ? s.safe.map(r => '• ' + r).join('\n') : 'None'}\n\n${s.score < 50 ? 'WARNING: Do NOT buy large amount. High rug risk.' : s.score < 80 ? 'Be careful. Small amount only.' : 'Looks relatively safe, but still DYOR.'}`);
}

async function checkSafetyDetail(addr) {
  const c = allCoins.find(x => x.address === addr);
  const el = document.getElementById('safetyDetail');
  if (el) el.textContent = 'Checking safety...';
  const s = await getSafety(c);
  if (el) {
    el.innerHTML = `<b style="color:${s.color}">Safety: ${s.score}/100 - ${s.label}</b><br><br><b>Risks:</b><br>${s.risks.join('<br>') || 'None'}<br><br><b>Safe:</b><br>${s.safe.join('<br>') || 'None'}`;
    el.style.color = '#e6e8ec';
  }
  render();
}
// Filtering and Sorting
function getFiltered() {
  let q = document.getElementById('search').value.toLowerCase().trim();
  let sort = document.getElementById('sort').value;
  let minLiq = +document.getElementById('minLiq').value || 0;
  let minVol = +document.getElementById('minVol').value || 0;
  let chain = document.getElementById('chain').value;
  let maxAge = +document.getElementById('maxAge').value || 9999;
  let minSafety = +document.getElementById('minSafety').value || 0;
  let list = [...allCoins];
  if (currentTab === 'trending') list = list.filter(c => Math.abs(c.change) >= 5);
  if (currentTab === 'watchlist') list = list.filter(c => watchlist.includes(c.address));
  if (currentTab === 'alerts') {
    const alertAddrs = alerts.filter(a => a.active).map(a => a.address);
    list = list.filter(c => alertAddrs.includes(c.address));
    if (!list.length) {
      // Show alert coins even if not in current 30, from alerts list
      return [];
    }
  }
  if (q) list = list.filter(c => (c.name + c.symbol + c.address).toLowerCase().includes(q));
  if (chain !== 'all') list = list.filter(c => c.chain === chain);
  list = list.filter(c => c.liq >= minLiq && c.vol >= minVol && (c.ageH === null || c.ageH <= maxAge));
  if (minSafety > 0) list = list.filter(c => (c.safetyScore ?? 0) >= minSafety);
  if (sort === 'newest') list.sort((a, b) => (a.ageH ?? 9999) - (b.ageH ?? 9999));
  if (sort === 'hottest') list.sort((a, b) => b.change - a.change);
  if (sort === 'liquidity') list.sort((a, b) => b.liq - a.liq);
  if (sort === 'volume') list.sort((a, b) => b.vol - a.vol);
  if (sort === 'mcap') list.sort((a, b) => b.mcap - a.mcap);
  if (sort === 'safety') list.sort((a, b) => (b.safetyScore ?? 0) - (a.safetyScore ?? 0));
  return list;
}

// Rendering: Builds coin grid with safety, alerts, portfolio state
function render() {
  let list = getFiltered();
  document.getElementById('watchCount').textContent = watchlist.length;
  document.getElementById('alertsCount').textContent = `Alerts: ${alerts.filter(a=>a.active).length} active`;
  // Special empty state for Alerts tab
  if (currentTab === 'alerts' && !alerts.filter(a=>a.active).length) {
    document.getElementById('grid').innerHTML = '<div class="empty">No active alerts.<br>Open a coin > Set Price Alert to get notified when it pumps or dumps.</div>';
    document.getElementById('empty').style.display = 'none';
    return;
  }
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('grid').innerHTML = list.map((c) => {
    let saved = watchlist.includes(c.address);
    let isHot = c.change >= 20;
    let isNew = c.ageH !== null && c.ageH <= 6;
    let acq = getAcquisition(c);
    let hasAlert = alerts.some(a => a.address === c.address && a.active);
    let inPortfolio = portfolio.some(p => p.address === c.address);
    let safetyTxt = c.safetyScore !== null && c.safetyScore !== undefined ? `${c.safetyScore}/100` : 'Check';
    let safetyColor = c.safetyScore >= 80 ? '#22c55e' : c.safetyScore >= 50 ? '#eab308' : c.safetyScore !== null ? '#ef4444' : '#eab308';
    return `<div class="card" onclick="openDetail(${allCoins.indexOf(c)})">
      <div class="top"><img src="${c.icon || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'"><div><b>${c.name}</b><br><small>${c.symbol} - ${c.chain.toUpperCase()}</small></div><span class="badge ${isHot ? 'hot' : isNew ? 'new' : ''}">${isHot ? 'HOT' : isNew ? 'NEW' : fmtAge(c.ageH)}</span></div>
      <div class="price">${fmtPrice(c.price)} <span class="${c.change >= 0 ? 'up' : 'down'}">${c.change >= 0 ? '+' : ''}${c.change.toFixed(2)}% 24h</span></div>
      <div class="stats"><div><span>Liquidity</span>${fmt(c.liq)}</div><div><span>Volume 24h</span>${fmt(c.vol)}</div><div><span>Market Cap</span>${fmt(c.mcap)}</div><div><span>Get It On</span>${acq.dexName}</div></div>
      <div style="font-size:11px;margin-top:8px;color:#9aa4b2">Where to get: ${acq.badge} ${inPortfolio ? '• IN PORTFOLIO' : ''} ${hasAlert ? '• ALERT ON' : ''}</div>
      <div style="font-size:11px;margin-top:6px">Safety: <span id="safety-${c.address}" style="color:${safetyColor};font-weight:700">${safetyTxt}</span> <button onclick="event.stopPropagation();checkSafety('${c.address}')" style="background:#1e293b;color:#fff;border:0;padding:3px 8px;border-radius:8px;cursor:pointer;font-size:11px">Check Safety</button></div>
      <div class="btns"><button class="buy" onclick="event.stopPropagation();buy('${c.chain}','${c.address}')">Buy / Mine</button><button class="watch ${saved ? 'saved' : ''}" onclick="event.stopPropagation();toggleWatch('${c.address}')">${saved ? 'Saved' : 'Watch'}</button></div>
      <div class="btns"><button class="watch alert-btn" onclick="event.stopPropagation();openAlertModal('${c.address}')">🔔 Price Alert</button><button class="watch" onclick="event.stopPropagation();addToPortfolioPrompt('${c.address}')">+ Portfolio</button></div>
    </div>`;
  }).join('');
}

// Watchlist
function toggleWatch(addr) {
  watchlist.includes(addr) ? watchlist = watchlist.filter(x => x !== addr) : watchlist.push(addr);
  localStorage.setItem('ch_watch', JSON.stringify(watchlist));
  render();
}

// Trading: Opens native DEX swap
function buy(chain, addr) {
  let m = {
    solana: `https://raydium.io/swap/?inputCurrency=sol&outputCurrency=${addr}`,
    bsc: `https://pancakeswap.finance/swap?outputCurrency=${addr}`,
    ethereum: `https://app.uniswap.org/swap?outputCurrency=${addr}`,
    base: `https://app.uniswap.org/swap?outputCurrency=${addr}`
  };
  window.open(m[chain] || `https://dexscreener.com/${chain}/${addr}`, '_blank');
}

// Utilities: Copy contract
function copyAddr(a) {
  navigator.clipboard.writeText(a);
  alert('Contract address copied.');
}

// --- PRICE ALERTS ---
function openAlertModal(addr) {
  const c = allCoins.find(x => x.address === addr);
  if (!c) return;
  const target = prompt(`Set Price Alert for ${c.name} (${c.symbol})\n\nCurrent price: ${fmtPrice(c.price)}\n\nEnter target price (e.g. ${c.price * 2}):`, (c.price * 2).toFixed(6));
  if (!target) return;
  const targetPrice = parseFloat(target);
  if (isNaN(targetPrice) || targetPrice <= 0) { alert('Invalid price'); return; }
  const type = targetPrice > c.price ? 'above' : 'below';
  // Remove old alert for same coin
  alerts = alerts.filter(a => a.address !== addr);
  alerts.push({ address: addr, symbol: c.symbol, name: c.name, targetPrice, type, createdPrice: c.price, active: true, createdAt: Date.now() });
  localStorage.setItem('ch_alerts', JSON.stringify(alerts));
  alert(`Alert set! You will be notified when ${c.symbol} goes ${type} ${fmtPrice(targetPrice)}`);
  updatePortfolioBar(); render();
}

function checkAlerts() {
  let triggered = [];
  alerts.forEach(a => {
    if (!a.active) return;
    const c = allCoins.find(x => x.address === a.address);
    if (!c) return;
    let hit = (a.type === 'above' && c.price >= a.targetPrice) || (a.type === 'below' && c.price <= a.targetPrice);
    if (hit) {
      triggered.push(a);
      a.active = false; a.triggeredAt = Date.now(); a.triggeredPrice = c.price;
    }
  });
  if (triggered.length) {
    localStorage.setItem('ch_alerts', JSON.stringify(alerts));
    triggered.forEach(a => {
      alert(`🚨 PRICE ALERT: ${a.name} (${a.symbol}) hit ${fmtPrice(a.triggeredPrice)} - Target was ${fmtPrice(a.targetPrice)} (${a.type})`);
    });
  }
}

function deleteAlert(addr) {
  alerts = alerts.filter(a => a.address !== addr);
  localStorage.setItem('ch_alerts', JSON.stringify(alerts));
  render(); updatePortfolioBar();
}

// --- PORTFOLIO TRACKER ---
function addToPortfolioPrompt(addr) {
  const c = allCoins.find(x => x.address === addr);
  if (!c) return;
  const amountStr = prompt(`Add to Portfolio - ${c.name} (${c.symbol})\n\nCurrent price: ${fmtPrice(c.price)}\n\nHow many tokens do you hold?`, '1000');
  if (!amountStr) return;
  const amount = parseFloat(amountStr);
  if (isNaN(amount) || amount <= 0) { alert('Invalid amount'); return; }
  const buyPriceStr = prompt(`At what price did you buy? (Current: ${fmtPrice(c.price)})`, c.price.toString());
  const buyPrice = parseFloat(buyPriceStr) || c.price;
  const existing = portfolio.find(p => p.address === addr);
  if (existing) {
    const totalCost = (existing.amount * existing.buyPrice) + (amount * buyPrice);
    existing.amount += amount;
    existing.buyPrice = totalCost / existing.amount;
  } else {
    portfolio.push({ address: addr, symbol: c.symbol, name: c.name, amount, buyPrice, buyDate: Date.now() });
  }
  localStorage.setItem('ch_portfolio', JSON.stringify(portfolio));
  alert(`Added ${amount} ${c.symbol} to portfolio at ${fmtPrice(buyPrice)}`);
  updatePortfolioBar(); render();
}

function removeFromPortfolio(addr) {
  portfolio = portfolio.filter(p => p.address !== addr);
  localStorage.setItem('ch_portfolio', JSON.stringify(portfolio));
  updatePortfolioBar(); render(); openPortfolio();
}

function updatePortfolioBar() {
  let totalValue = 0; let totalCost = 0;
  portfolio.forEach(p => {
    const c = allCoins.find(x => x.address === p.address);
    const currentPrice = c ? c.price : p.buyPrice;
    totalValue += p.amount * currentPrice;
    totalCost += p.amount * p.buyPrice;
  });
  const pnl = totalValue - totalCost;
  const pnlPct = totalCost > 0 ? (pnl / totalCost * 100) : 0;
  const valEl = document.getElementById('portfolioValue');
  const pnlEl = document.getElementById('portfolioPnL');
  if (valEl) valEl.textContent = '$' + totalValue.toFixed(2);
  if (pnlEl) pnlEl.innerHTML = `Portfolio: ${portfolio.length} coins • P/L: <span style="color:${pnl >= 0 ? '#22c55e' : '#ef4444'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)} (${pnlPct.toFixed(1)}%)</span>`;
}

function openPortfolio() {
  document.getElementById('modal').classList.add('open');
  let rows = '';
  let totalValue = 0; let totalCost = 0;
  portfolio.forEach(p => {
    const c = allCoins.find(x => x.address === p.address);
    const currentPrice = c ? c.price : p.buyPrice;
    const value = p.amount * currentPrice;
    const cost = p.amount * p.buyPrice;
    const pnl = value - cost;
    const pnlPct = cost > 0 ? (pnl / cost * 100) : 0;
    totalValue += value; totalCost += cost;
    rows += `<div style="background:#0b0e14;padding:12px;border-radius:10px;margin-bottom:8px"><b>${p.name} (${p.symbol})</b><br><span style="font-size:12px;color:#9aa4b2">Hold: ${p.amount} • Buy: ${fmtPrice(p.buyPrice)} • Now: ${fmtPrice(currentPrice)}</span><br><span style="font-size:13px">Value: $${value.toFixed(2)} • P/L: <span style="color:${pnl >= 0 ? '#22c55e' : '#ef4444'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)} (${pnlPct.toFixed(1)}%)</span></span><br><button onclick="removeFromPortfolio('${p.address}')" style="background:#ef4444;color:#fff;border:0;padding:6px 10px;border-radius:8px;margin-top:6px;cursor:pointer">Remove</button></div>`;
  });
  let alertsRows = alerts.map(a => `<div style="background:#0b0e14;padding:10px;border-radius:10px;margin-bottom:6px;font-size:13px">${a.symbol} - ${a.type} ${fmtPrice(a.targetPrice)} • ${a.active ? 'ACTIVE' : 'TRIGGERED'} ${a.active ? `<button onclick="deleteAlert('${a.address}');openPortfolio()" style="background:#ef4444;color:#fff;border:0;padding:4px 8px;border-radius:6px;float:right;cursor:pointer">Delete</button>` : ''}</div>`).join('');
  document.getElementById('detail').innerHTML = `
    <h2>My Portfolio</h2>
    <p style="color:#9aa4b2;font-size:13px">Total Value: $${totalValue.toFixed(2)} • Total Cost: $${totalCost.toFixed(2)}</p>
    <div style="margin-top:12px">${rows || '<p style="color:#9aa4b2">No holdings yet. Open a coin and tap + Portfolio.</p>'}</div>
    <h3 style="margin-top:16px">My Price Alerts</h3>
    <div style="margin-top:8px">${alertsRows || '<p style="color:#9aa4b2">No alerts yet.</p>'}</div>
    <div class="btns"><button class="buy" onclick="closeModal()">Close</button></div>
  `;
}

// Data Accuracy: Fetches real hourly OHLCV chart data directly from GeckoTerminal
async function fetchRealChart(c) {
  if (!c.pairAddress) return null;
  try {
    const net = geckoNetwork(c.chain);
    const res = await fetch(`https://api.geckoterminal.com/api/v2/networks/${net}/pools/${c.pairAddress}/ohlcv/hour?aggregate=1&limit=24`).then(r => r.json());
    const list = res?.data?.attributes?.ohlcv_list || [];
    if (!list.length) return null;
    const sorted = [...list].sort((a, b) => a[0] - b[0]);
    return {
      labels: sorted.map(x => new Date(x[0] * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
      data: sorted.map(x => parseFloat(x[4]))
    };
  } catch (e) { return null; }
}

// Token Detail: Detail sheet with market overview, safety, alerts, portfolio, acquisition guide
let chart;
async function openDetail(idx) {
  let c = allCoins[idx];
  if (!c) return;
  let acq = getAcquisition(c);
  let existingAlert = alerts.find(a => a.address === c.address && a.active);
  let inPortfolio = portfolio.find(p => p.address === c.address);
  document.getElementById('modal').classList.add('open');
  document.getElementById('detail').innerHTML = `
    <h2>${c.name} (${c.symbol})</h2><small>${c.chain.toUpperCase()} - ${c.dex || 'DEX'} - ${fmtAge(c.ageH)} - Live Price</small>
    <div class="price" style="font-size:28px">${fmtPrice(c.price)} <span class="${c.change >= 0 ? 'up' : 'down'}">${c.change >= 0 ? '+' : ''}${c.change.toFixed(2)}% 24h</span></div>
    <canvas id="priceChart" height="140"></canvas>
    <div style="font-size:11px;color:#9aa4b2;margin:6px 0">Real 24h chart - Source: GeckoTerminal / DexScreener</div>
    <div class="detail-grid"><div><span>Liquidity</span>${fmt(c.liq)}</div><div><span>Volume 24h</span>${fmt(c.vol)}</div><div><span>Market Cap</span>${fmt(c.mcap)}</div><div><span>Chain</span>${c.chain}</div></div>
    <div class="safety-box">
      <h3>🛡️ Safety / Rug Check</h3>
      <div id="safetyDetail" style="font-size:12px;margin:8px 0;color:#eab308">${c.safetyScore ? `Cached: ${c.safetyScore}/100 - Click to re-check` : 'Click to check honeypot, mint, tax, blacklist...'}</div>
      <div class="btns"><button class="buy" onclick="checkSafetyDetail('${c.address}')">Run Safety Check</button></div>
    </div>
    <div class="alert-box">
      <h3>🔔 Price Alert</h3>
      <p style="font-size:12px;color:#9aa4b2">${existingAlert ? `Active alert: ${existingAlert.type} ${fmtPrice(existingAlert.targetPrice)}` : 'Get notified when this coin hits your target price.'}</p>
      <div class="btns"><button class="buy" onclick="openAlertModal('${c.address}')">Set Price Alert</button>${existingAlert ? `<button class="watch" onclick="deleteAlert('${c.address}');openDetail(${idx})">Delete Alert</button>` : ''}</div>
    </div>
    <div class="portfolio-box">
      <h3>💼 Portfolio</h3>
      <p style="font-size:12px;color:#9aa4b2">${inPortfolio ? `You hold ${inPortfolio.amount} ${c.symbol} • Buy: ${fmtPrice(inPortfolio.buyPrice)} • P/L: ${fmtPrice(c.price - inPortfolio.buyPrice)} per token` : 'Track how much you own of this coin.'}</p>
      <div class="btns"><button class="buy" onclick="addToPortfolioPrompt('${c.address}')">+ Add to Portfolio</button>${inPortfolio ? `<button class="watch" onclick="removeFromPortfolio('${c.address}');openDetail(${idx})">Remove</button>` : ''}</div>
    </div>
    <div class="acquire">
      <h3>Where To Get This Coin</h3>
      <span class="tag ${acq.badgeClass}">${acq.badge}</span>
      <span class="tag">DEX: ${acq.dexName}</span>
      <span class="tag">Chain: ${c.chain.toUpperCase()}</span>
      <p style="margin-top:8px">${acq.text}</p>
      <p style="margin-top:8px">${acq.steps.join('<br>')}</p>
      <div class="btns"><button class="buy" onclick="window.open('${acq.dexUrl}','_blank')">Open ${acq.dexName}</button><button class="watch" onclick="window.open('https://www.coingecko.com/en/search?query=${c.symbol}','_blank')">Check CEX Listing</button></div>
    </div>
    <div class="info-box">Most new coins in Coin Hunter are NOT mineable. Mining only works for Proof-of-Work coins like BTC, LTC, DOGE. For all other tokens, use Buy / Swap on the DEX above.</div>
    <b>Contract Address</b><div class="contract"><span>${c.address}</span><button onclick="copyAddr('${c.address}')">Copy</button></div>
    <p style="color:#9aa4b2;font-size:13px;margin:8px 0">${c.desc || 'No description available. Always conduct your own research before trading.'}</p>
    <div class="btns"><button class="buy" onclick="buy('${c.chain}','${c.address}')">Buy on DEX</button><button class="watch" onclick="window.open('https://dexscreener.com/${c.chain}/${c.address}','_blank')">View on DexScreener</button></div>

// Modal: Closes detail sheet
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// Initialization
load();
setInterval(load, 30000);
</script>
