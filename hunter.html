<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Hunter Pro - No Pump.fun Scams</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e14;color:#e6e8ec;font-family:Arial,sans-serif;padding:12px;transition:.3s}
body.light{background:#f1f5f9;color:#0f172a}
body.light .card,body.light .sheet,body.light .portfolio-bar,body.light .whale-bar,body.light .boost-bar,body.light .scam-banner{background:#fff;border-color:#cbd5e1}
body.light .stats div,body.light .detail-grid div,body.light .contract,body.light canvas,body.light .acquire,body.light .safety-box,body.light .alert-box,body.light .portfolio-box,body.light .whale-box,body.light .boost-box{background:#f8fafc}
body.light .search,body.light .sort,body.light .filters input,body.light .filters select{background:#fff;color:#0f172a;border-color:#cbd5e1}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
header h1{font-size:22px}
header h1 span{color:#22c55e}
.header-btns{display:flex;gap:8px;align-items:center}
.theme-btn,.share-top{background:#1e293b;color:#fff;border:0;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px}
.share-top{background:#25D366;color:#000}
.live{background:#ef4444;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.updated{font-size:11px;color:#9aa4b2;margin-bottom:10px}
.scam-banner{background:#450a0a;border:1px solid #ef4444;border-radius:12px;padding:12px;margin-bottom:12px}
.scam-banner b{color:#fecaca;font-size:14px}
.scam-banner p{font-size:12px;color:#fecaca;margin:6px 0;line-height:1.5}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toggle-row button{border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:12px}
.toggle-on{background:#22c55e;color:#000}
.toggle-off{background:#333;color:#fff}
.boost-bar{background:#2e1065;border:1px solid #a855f7;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.boost-bar b{font-size:13px;color:#d8b4fe}
.boost-scroll{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.boost-chip{background:#1e293b;color:#fff;border:1px solid #a855f7;padding:8px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;font-size:12px}
.boost-chip b{color:#d8b4fe}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#1e293b;color:#fff;border:0;padding:8px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.tabs button.active{background:#22c55e;color:#000;font-weight:700}
.search{flex:1;min-width:180px;padding:10px;border-radius:10px;border:1px solid #232a35;background:#151a24;color:#fff}
.sort{padding:10px;border-radius:10px;border:1px solid #232a35;background:#151a24;color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;background:#151a24;padding:10px;border-radius:12px;margin-bottom:12px;font-size:12px}
.filters label{color:#9aa4b2}
.filters input,.filters select{background:#0b0e14;color:#fff;border:1px solid #232a35;padding:6px;border-radius:8px;width:90px;margin-left:4px}
</style>
</head>
